name: Build Windows EXE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Derle - CLI ve Core
        run: dotnet build TrockiMotionStudio.sln -c Release
      - name: Derle - Windows Forms PRO
        run: dotnet build src/MotionStudio.App/MotionStudio.App.csproj -c Release
      - name: Tek dosya Windows x64 EXE
        run: dotnet publish src/MotionStudio.App/MotionStudio.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish
      - name: EXE kontrolü
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/TrockiMotionStudio.exe")) {
            throw "TrockiMotionStudio.exe bulunamadı."
          }
          Get-Item "publish/TrockiMotionStudio.exe" | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: TROCKI-Motion-Studio-PRO-Windows-x64
          path: publish/
          if-no-files-found: error

      - name: Windows Setup.exe ve masaüstü kısayolu
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup -y --no-progress
          }
          & $compiler setup\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup derlemesi başarısız." }
      - uses: actions/upload-artifact@v4
        with:
          name: TROCKI-Motion-Studio-PRO-Setup-Windows-x64
          path: installer-output/*.exe
          if-no-files-found: error
